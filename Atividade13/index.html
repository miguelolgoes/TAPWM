<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Texto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Conversor de Texto</h2>

        <input type="text" id="texto" placeholder="Digite seu texto aqui...">

        <div class="opcoes">
            <label>
                <input type="radio" name="transformacao" id="maiusculas">
                MAIÚSCULAS
            </label>

            <label>
                <input type="radio" name="transformacao" id="minusculas">
                minúsculas
            </label>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
