<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exercícios Array</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Exercícios com Array</h1>

    <div class="card">
      <h2>Exercício 1</h2>
      <p>Digite 3 números:</p>

      <input type="number" id="n1" placeholder="Número 1">
      <input type="number" id="n2" placeholder="Número 2">
      <input type="number" id="n3" placeholder="Número 3">

      <button onclick="executarEx1()">Calcular</button>
    </div>

    <div class="card">
      <h2>Exercício 2</h2>
      <p>Digite 5 letras:</p>

      <input type="text" id="l1" maxlength="1">
      <input type="text" id="l2" maxlength="1">
      <input type="text" id="l3" maxlength="1">
      <input type="text" id="l4" maxlength="1">
      <input type="text" id="l5" maxlength="1">

      <button onclick="executarEx2()">Gerar Palavras</button>
    </div>

    <div id="resultado"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
