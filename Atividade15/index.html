<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos Fatec Sorocaba</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Cursos da Fatec Sorocaba</h1>

        <label for="curso">Escolha um curso:</label>

        <select id="curso" onchange="abrirCurso()">
            <option value="">-- Selecione um curso --</option>
            <option value="ADS">Análise e Desenvolvimento de Sistemas</option>
            <option value="LOG">Logística</option>
            <option value="MEC">Manufatura Avançada</option>
            <option value="POL">Polímeros</option>
            <option value="GQ">Gestão da Qualidade</option>
            <option value="EA">Eletrônica Automotiva</option>
        </select>
    </div>

    <script src="script.js"></script>

</body>
</html>
