<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exercícios JS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Exercícios JavaScript</h1>

  <div class="box">
    <h2>1- Maior de três números</h2>
    <input id="n1" type="number" placeholder="Número 1">
    <input id="n2" type="number" placeholder="Número 2">
    <input id="n3" type="number" placeholder="Número 3">
    <button onclick="executarMaior()">Calcular</button>
    <p id="res1"></p>
  </div>

  <div class="box">
    <h2>2- Ordem crescente</h2>
    <input id="c1" type="number">
    <input id="c2" type="number">
    <input id="c3" type="number">
    <button onclick="executarOrdem()">Ordenar</button>
    <p id="res2"></p>
  </div>

  <div class="box">
    <h2>3- Palíndromo</h2>
    <input id="texto" type="text" placeholder="Digite uma palavra/frase">
    <button onclick="executarPalindromo()">Verificar</button>
    <p id="res3"></p>
  </div>

  <div class="box">
    <h2>4- Subconjunto</h2>
    <input id="p1" type="text" placeholder="Palavra 1">
    <input id="p2" type="text" placeholder="Palavra 2">
    <button onclick="executarSubconjunto()">Verificar</button>
    <p id="res4"></p>
  </div>

  <div class="box">
    <h2>5- Dia da semana</h2>
    <input id="data" type="date">
    <button onclick="executarData()">Verificar</button>
    <p id="res5"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
